name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Static ffmpeg build from https://github.com/gtsteffaniak/ffmpeg/releases
  FFMPEG_VERSION: "9.0.2"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go vet
        run: |
          go vet ./...
          go vet -C test/hls ./...
      - name: gofmt
        run: test -z "$(gofmt -s -l . test/hls)"

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install ffmpeg (static release)
        run: bash scripts/install-ffmpeg.sh
      - name: Unit tests (requires ffmpeg)
        run: go test -race ./... -count=1
      - name: Build CLI
        run: go build -o bin/go-ffmpeg ./cmd/go-ffmpeg

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Integration tests (docker ffmpeg 8.1.2)
        run: bash scripts/docker/run-integration-tests.sh

  hls-software:
    name: HLS software matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: HLS tests (docker ffmpeg 8.1.2)
        run: bash scripts/docker/run-hls-tests.sh

  static-ffmpeg:
    name: Static ffmpeg detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install ffmpeg (static release)
        run: bash scripts/install-ffmpeg.sh
      - name: Detection and version-gated args
        env:
          GOFFMPEG_SKIP_HW: "1"
        run: |
          go test ./capabilities ./encode -count=1 -run 'TestDetect|TestFeatureFlags|TestAppendReadrate'
          go build -o bin/go-ffmpeg ./cmd/go-ffmpeg
          ./bin/go-ffmpeg -skip-hw-tests -json | head -10

  ffmpeg-matrix:
    name: FFmpeg ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [5.1.9, 6.1.6, 7.1.5, 8.1.2, 9.0.1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Matrix tests (docker gtstef/ffmpeg:${{ matrix.version }})
        run: bash scripts/docker/run-version-tests.sh "${{ matrix.version }}"
